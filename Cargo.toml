[package]
name = "zim-mcp"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Offline access to Kiwix ZIM archives (Wikipedia etc.) for any AI tool: MCP server, library manager and Markdown export"
readme = "README.md"
keywords = ["zim", "kiwix", "mcp", "wikipedia", "offline"]
categories = ["command-line-utilities"]
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE"]

[dependencies]
rmcp = { version = "3.10", features = ["server", "transport-io", "macros", "elicitation"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
cxx = "1.0"
ureq = "3.5"
sha2 = "0.11"
quick-xml = "0.42"
htmd = "0.5"
markup5ever_rcdom = "0.38" # htmd's DOM, to read infobox rows
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[profile.release]
strip = true
