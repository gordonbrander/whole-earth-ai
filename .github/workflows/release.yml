# Builds the zim-mcp release archives when a version tag (v1.2.3) is pushed:
# zim-mcp (a single self-contained binary) + GPL text + source offer.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled on Apple Silicon: GitHub is retiring Intel macOS runners.
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, cross: true }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        if: ${{ !matrix.cross }}
        with: { tool: just }
      - name: Test
        if: ${{ !matrix.cross }}
        run: |
          just testdata
          cargo test --workspace --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          dir=zim-mcp-$version-${{ matrix.name }}
          mkdir "$dir"
          bin=target/${{ matrix.target }}/release/zim-mcp
          if [ "${{ runner.os }}" = Windows ]; then cp "$bin.exe" "$dir/"; else cp "$bin" "$dir/"; fi
          cp LICENSE "$dir/LICENSE"
          cat > "$dir/SOURCE.txt" <<TXT
          zim-mcp $version is free software: GPL-3.0-or-later (see LICENSE).
          It includes zimfile, a ZIM reader and writer ported from libzim, which is
          part of the same repository.

          Corresponding source:
            $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA

          For three years from the date you received this binary, the zim-mcp
          maintainers will also provide this source on request, for no more than
          the cost of physically performing distribution, via
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues.
          TXT

          # Smoke test: runs from its own folder, with nothing installed.
          if [ -z "${{ matrix.cross }}" ]; then (cd "$dir" && ./zim-mcp --version); fi

          echo "PKG=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PKG }}

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Merge macOS into a universal build, archive everything
        run: |
          set -e
          version=${GITHUB_REF_NAME#v}
          cd dist   # one folder per build job, named after it
          f=zim-mcp
          lipo -create "macos-arm64/$f" "macos-x64/$f" -output "macos-arm64/$f.u"
          mv "macos-arm64/$f.u" "macos-arm64/$f"
          codesign -s - -f "macos-arm64/$f"
          mv macos-arm64 macos-universal && rm -rf macos-x64
          mkdir ../out
          for name in macos-universal linux-x64 linux-arm64 windows-x64; do
            n="zim-mcp-$version-$name"
            mv "$name" "$n"
            if [ "$name" = windows-x64 ]; then
              zip -qr "../out/$n.zip" "$n"
            else
              chmod +x "$n/zim-mcp"   # artifacts don't keep permissions
              tar czf "../out/$n.tar.gz" "$n"
            fi
          done
          cd ../out && shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
