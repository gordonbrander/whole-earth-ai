[package]
name = "zimfile"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read and write ZIM archives (Kiwix, openZIM) and their Xapian search indexes in pure Rust"
repository = "https://github.com/gordonbrander/zim-mcp"
readme = "README.md"
keywords = ["zim", "kiwix", "openzim", "wikipedia", "offline"]
categories = ["parser-implementations", "encoding"]
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
flate2 = "1.1.11"
frostem = { version = "1.20260821.8", default-features = false, features = ["armenian", "basque", "catalan", "indonesian", "irish", "lithuanian", "nepali"] }
getrandom = "0.4.3"
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
liblzma = { version = "0.4.9", features = ["static"] }
md-5 = "0.11.0"
rust-stemmers = "1.2.0"
tantivy = "0.27.0"
zstd = "0.14.4"

[dev-dependencies]
sha2 = "0.11.1"
