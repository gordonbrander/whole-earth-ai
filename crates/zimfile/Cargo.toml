[package]
name = "zimfile"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read and write ZIM archives (Kiwix, openZIM) in pure Rust, with tantivy full-text search"
repository = "https://github.com/gordonbrander/zim-mcp"
keywords = ["zim", "kiwix", "openzim", "wikipedia", "offline"]
categories = ["parser-implementations", "encoding"]
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
getrandom = "0.4.3"
liblzma = { version = "0.4.9", features = ["static"] }
md-5 = "0.11.0"
tantivy = "0.27.0"
zstd = "0.14.4"

[dev-dependencies]
sha2 = "0.11.1"
